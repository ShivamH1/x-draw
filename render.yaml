envVarGroups:
  - name: shared-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  - name: http-backend
    type: web
    env: node
    buildCommand: 'pnpm install && pnpm turbo build --filter=http-backend'
    startCommand: 'node apps/http-backend/dist/index.js'
    envVars:
      - fromGroup: shared-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: x-draw-db
          property: connectionString
      # IMPORTANT: Replace <your-frontend-url> with your actual Vercel deployment URL
      # once it's available. For example: https://x-draw-frontend-123.vercel.app
      - key: CORS_ORIGIN
        value: 'https://<your-frontend-url>'

  - name: ws-backend
    type: web
    env: node
    buildCommand: 'pnpm install && pnpm turbo build --filter=ws-backend'
    startCommand: 'node apps/ws-backend/dist/index.js'
    envVars:
      - fromGroup: shared-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: x-draw-db
          property: connectionString
      - key: PORT
        value: '8080'

databases:
  - name: x-draw-db
    databaseName: xdraw
    user: xdraw
    plan: free
    region: oregon
    ipAllowList: []
    postgresMajorVersion: "16"
