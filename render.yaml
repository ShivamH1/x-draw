envVarGroups:
  - name: shared-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  - name: http-backend
    type: web
    runtime: node
    region: oregon
    plan: free
    buildCommand: |
      npm install -g pnpm &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @repo/db exec prisma generate &&
      pnpm --filter @repo/db exec prisma migrate deploy &&
      pnpm turbo build --filter=http-backend
    startCommand: node apps/http-backend/dist/index.js
    envVars:
      - fromGroup: shared-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: x-draw-db
          property: connectionString
      - key: PORT
        value: '10000'
      # IMPORTANT: Replace with your actual Vercel deployment URL after deploying frontend
      - key: CORS_ORIGIN
        value: 'https://your-app.vercel.app'

  - name: ws-backend
    type: web
    runtime: node
    region: oregon
    plan: free
    buildCommand: |
      npm install -g pnpm &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @repo/db exec prisma generate &&
      pnpm turbo build --filter=ws-backend
    startCommand: node apps/ws-backend/dist/index.js
    envVars:
      - fromGroup: shared-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: x-draw-db
          property: connectionString
      - key: PORT
        value: '10000'

databases:
  - name: x-draw-db
    databaseName: xdraw
    user: xdraw
    plan: free
    region: oregon
    ipAllowList: []
    postgresMajorVersion: "16"
